location = /project-roadmap {
    return 308 /project-roadmap/$is_args$args;
}

location = /project-roadmap/api {
    return 308 /project-roadmap/api/$is_args$args;
}

location ^~ /project-roadmap/api/ {
    proxy_pass http://127.0.0.1:5002/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    proxy_read_timeout 30s;
    client_max_body_size 1m;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/vui-prototype-crawl-headers.conf;
}

location ^~ /project-roadmap/assets/ {
    alias /var/www/project-roadmap/assets/;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    include /etc/nginx/snippets/vui-prototype-crawl-headers.conf;
}

location ^~ /project-roadmap/ {
    alias /var/www/project-roadmap/;
    index index.html;
    try_files $uri $uri/ /project-roadmap/index.html;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    include /etc/nginx/snippets/vui-prototype-crawl-headers.conf;
}
